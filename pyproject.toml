[project]
name = "legalpsy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub",
  "datasets",
  "pydantic",
  "pyyaml",
  "pandas",
  "rapidfuzz",
  "regex",
  "httpx",
  "python-dateutil",
  "transformers",
  "wandb",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]